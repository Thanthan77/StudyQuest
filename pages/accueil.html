<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyQuest - Accueil</title>
    <!-- Lien vers ton fichier CSS principal de la grille / dashboard -->
    <link rel="stylesheet" href="../css/components/accueil.css"> 
    <link rel="stylesheet" href="../css/general.css"> 
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-body">

    <!-- Barre latérale (Sidebar) -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="sidebar-logo">StudyQuest</span>
        </div>
        <nav class="sidebar-nav">
            <a href="accueil.html" class="nav-item active"><i class="fa-solid fa-house"></i> Accueil</a>
            <a href="groups.html" class="nav-item"><i class="fa-solid fa-user-group"></i> Mes groupes</a>
            <a href="statistiques.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Statistiques</a>
        </nav>
        <div class="sidebar-footer">
            <button id="logout-btn" class="logout-btn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Déconnexion
            </button>
        </div>
    </aside>

    <!-- Contenu principal (Grille Bento) -->
    <main class="main-content">
        
        <!-- En-tête -->
        <header class="dashboard-header">
            <h1 class="welcome-title">Bonjour <span id="username-display">Utilisateur</span></h1>
            <div class="timer-badge" id="midnight-timer">
                <i class="fa-solid fa-triangle-exclamation"></i> <span id="countdown-text">Calcul en cours...</span>
            </div>
        </header>

        <!-- Grille Bento principale -->
        <div class="bento-grid">
            
            <!-- Colonne de Gauche (Séries & Tâches) -->
            <div class="bento-left">
                <!-- Carte Série / Streak -->
                <div class="streak-card">
                    <div class="streak-info">
                        <div class="streak-count">
                            <i class="fa-solid fa-fire streak-icon"></i>
                            <span><strong id="streak-count-display"></strong> jours</span>
                        </div>
                        <div class="streak-sub">
                            <i class="fa-regular fa-snowflake gel-Icon"></i> Gels <strong id="freezes-display"></strong> Un gel sauve ta série si tu rates un jour
                        </div>
                    </div>
                    <div class="streak-actions">
                        <div class="checkbox-mock">
                            <div class="mini-checkbox" id="mini-box-1"></div>
                            <div class="mini-checkbox" id="mini-box-2"></div>
                        </div>
                        <span class="tasks-progress" id="tasks-progress-display"></span>
                    </div>
                </div>

                <!-- Section Tâches -->
                <div class="tasks-section">
                    <div class="tasks-tabs">
                        <button class="tab-btn active">Aujourd'hui <span></span></button>
                        <button class="tab-btn">En retard <span></span></button>
                        <button class="tab-btn">À venir <span></span></button>
                        <button class="tab-btn">Flexibles <span></span></button>
                        <button class="tab-btn">Complétées <span></span></button>
                        <button class="add-task-btn"><i class="fa-solid fa-plus"></i> Ajouter</button>
                    </div>

                    <!-- Conteneur dynamique des tâches (affiche les tâches ou le message par défaut s'il n'y en a pas) -->
                    <div class="tasks-list" id="tasks-container">
                        <!-- Injection dynamique JS -->
                    </div>
                </div>
            </div>

            <!-- Colonne de Droite (Statistiques & Groupes) -->
            <div class="bento-right">
                
                <!-- Carte Statistiques -->
                <div class="bento-card stats-card">
                    <h3>Mes statistiques</h3>
                    <div class="stat-big">
                        <span class="stat-number" id="total-tasks-stat"></span>
                        <span class="stat-label">tâches validées depuis le début</span>
                    </div>
                    <div class="stat-row">
                        <span>Record de série</span>
                        <strong id="record-streak-stat"></strong>
                    </div>
                    <div class="stat-row">
                        <span>Série actuelle</span>
                        <strong id="current-streak-stat"></strong>
                    </div>
                    <div class="stat-progress-block">
                        <span>Prochain gel</span>
                        <span id="gel-progress-text"></span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="gel-progress-fill"></div>
                        </div>
                    </div>
                </div>

                <!-- Carte Groupes -->
                <div class="bento-card groups-card">
                    <div class="groups-header">
                        <h3>Mes groupes</h3>
                        <span class="groups-count" id="groups-count-badge"></span>
                    </div>
                    
                    <!-- Conteneur dynamique des groupes (affiche les groupes ou le message par défaut s'il n'y en a pas) -->
                    <div id="groups-container">
                        <!-- Injection dynamique JS -->
                    </div>

                    <button class="join-group-btn"><i class="fa-solid fa-plus"></i> Rejoindre un groupe</button>
                </div>

            </div>

        </div>
    </main>

     <!-- Modal d'ajout de tâche -->
<div id="task-modal" class="modal-overlay" >
    <div class="modal-content">
        <div class="modal-header">
            <h2>Nouvelle tâche</h2>
            <button id="close-modal-btn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <form id="add-task-form">
            <div class="form-group">
                <label>Que veux-tu faire ?</label>
                <input type="text" id="task-title-input" placeholder="Ex. : Relire le cours d'anglais" required autocomplete="off">
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label>Quand</label>
                    <div class="toggle-options">
                        <button type="button" class="toggle-btn active" data-when="specific">
                            <i class="fa-regular fa-calendar"></i> Un jour précis
                        </button>
                        <button type="button" class="toggle-btn" data-when="flexible">
                            <i class="fa-solid fa-layer-group"></i> Quand je veux
                        </button>
                    </div>
                </div>

                <div class="form-group half" id="date-container">
                    <label>Date</label>
                    <div class="input-with-icon">
                        <input type="date" id="task-date-input">
                    </div>
                </div>
            </div>

            <div class="form-group" id="recurrence-container" style="display: none;">
                <label>Fréquence de récurrence</label>
                <div class="toggle-options">
                    <button type="button" class="rec-btn active" data-rec="daily">Tous les jours</button>
                    <button type="button" class="rec-btn" data-rec="weekly">Jours précis de la semaine</button>
                </div>

                <!-- Sélection des jours de la semaine (caché par défaut si "Tous les jours" est actif) -->
                <div id="weekly-days-container" style="display: none; margin-top: 12px;">
                    <label style="font-size: 0.85rem; margin-bottom: 6px; display: block; color: var(--text-muted);">Sélectionne les jours :</label>
                    <div class="days-selector" style="display: flex; gap: 6px; flex-wrap: wrap;">
                        <label class="day-chip"><input type="checkbox" name="rec-day" value="1"> L</label>
                        <label class="day-chip"><input type="checkbox" name="rec-day" value="2"> M</label>
                        <label class="day-chip"><input type="checkbox" name="rec-day" value="3"> M</label>
                        <label class="day-chip"><input type="checkbox" name="rec-day" value="4"> J</label>
                        <label class="day-chip"><input type="checkbox" name="rec-day" value="5"> V</label>
                        <label class="day-chip"><input type="checkbox" name="rec-day" value="6"> S</label>
                        <label class="day-chip"><input type="checkbox" name="rec-day" value="0"> D</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Catégorie</label>
                <div class="category-options">
                    <button type="button" class="category-btn active" data-category="school">
                        <i class="fa-solid fa-book"></i> École
                    </button>
                    <button type="button" class="category-btn" data-category="perso">
                        <i class="fa-solid fa-user"></i> Personnel
                    </button>
                    <button type="button" class="toggle-btn" data-when="recurring">
                        <i class="fa-solid fa-rotate"></i> Récurrente
                    </button>
                </div>
            </div>

            <div class="modal-actions">
                <button type="submit" class="btn-primary">Ajouter la tâche</button>
                <button type="button" id="cancel-modal-btn" class="btn-secondary">Annuler</button>
            </div>
        </form>
    </div>
</div>

    <!-- Module JS d'authentification et de gestion de session -->
    <script type="module" src="../js/auth.js"></script>
    <!-- Module JS de la page d'accueil -->
    <script type="module" src="../js/accueil.js"></script>
</body>
</html>
