<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyQuest - Inscription</title>
    <!-- Chemin vers le CSS (ajoute "../" si ton fichier est dans un dossier "pages/") -->
    <link rel="stylesheet" href="../css/components/login.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <main class="login-container">
        <div class="login-card">
            
            <!-- Logo principal -->
            <div class="logo-badge">
                <i class="fa-solid fa-fire logo-icon"></i>
            </div>

            <!-- Titres & Sous-titres -->
            <h1 class="brand-title">StudyQuest</h1>
            <p class="brand-subtitle">
                Valide tes tâches, garde ta série.
            </p>

            <!-- Formulaire d'inscription -->
            <form id="signup-form">
                <div class="form-group">
                    <label for="username-input">Choisis ton pseudo</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input 
                            type="text" 
                            id="username-input" 
                            placeholder="Choisis ton pseudo..." 
                            required 
                            autocomplete="off"
                            autocapitalize="none"
                            spellcheck="false"
                            maxlength="20"
                        >
                    </div>
                </div>

                <!-- Champ Code PIN à 4 chiffres -->
                <div class="form-group">
                    <label>Code PIN à 4 chiffres</label>
                    <div class="pin-container">
                        <input type="password" inputmode="numeric" maxlength="1" class="pin-input" required autocomplete="off">
                        <input type="password" inputmode="numeric" maxlength="1" class="pin-input" required autocomplete="off">
                        <input type="password" inputmode="numeric" maxlength="1" class="pin-input" required autocomplete="off">
                        <input type="password" inputmode="numeric" maxlength="1" class="pin-input" required autocomplete="off">
                    </div>
                    <p class="auth-hint" style="margin-top: 6px;">Il remplace le mot de passe, retiens-le bien.</p>
                </div>

                <p id="error-message" class="error-msg"></p>

                <button type="submit" class="btn-submit">
                    <span>Créer mon compte</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="perk-banner" style="margin-top: 16px; font-size: 12px; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    <i class="fa-regular fa-snowflake"></i>
                    <span>1 gel de série offert dès l’arrivée</span>
                </div>
            </form>

            <!-- Lien bascule vers la connexion -->
            <div class="auth-switch">
                <span>Déjà un compte ?</span> 
                <a href="../index.html">Se connecter</a>
            </div>

        </div>
    </main>

    <!-- JS Navigation PIN & Auth module -->
    <script src="../js/pin.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
